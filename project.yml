name: WPaste
options:
  bundleIdPrefix: com.chujianyun
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  WPaste:
    type: application
    platform: macOS
    sources:
      - path: WPaste
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chujianyun.wpaste
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        CODE_SIGNING_ALLOWED: NO
  WPasteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WPasteTests
    dependencies:
      - target: WPaste
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  WPaste:
    build:
      targets:
        WPaste: all
        WPasteTests: [test]
    test:
      targets:
        - WPasteTests
